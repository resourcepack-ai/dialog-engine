plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'ai.resourcepack'
version = '0.6.4'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
    // spigot-api: the one API both servers have. Paper keeps Spigot's API, so
    // compiling against it is what makes one jar run on both.
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    // ai.resourcepack:common, our own shared plugin library. Exclusive: the
    // ai.resourcepack group is looked for here and nowhere else, so a
    // look-alike published to Central or any repository above cannot stand in
    // for it. (A checkout with ../plugin-common builds it from source instead;
    // see settings.gradle.)
    exclusiveContent {
        forRepository {
            maven { url = 'https://repo.resourcepack.ai' }
        }
        filter {
            includeGroup 'ai.resourcepack'
        }
    }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.21.8-R0.1-SNAPSHOT'

    // MiniMessage and Adventure, shaded and relocated: Spigot has neither, and
    // Paper's own copy is left alone (ours never meets it). Gson is the
    // server's on both, so it is not shaded.
    implementation('net.kyori:adventure-api:4.24.0') { exclude group: 'org.jetbrains' }
    implementation('net.kyori:adventure-text-minimessage:4.24.0') { exclude group: 'org.jetbrains' }
    implementation('net.kyori:adventure-text-serializer-gson:4.24.0') {
        exclude group: 'com.google.code.gson'
        exclude group: 'org.jetbrains'
    }
    implementation('net.kyori:adventure-text-serializer-plain:4.24.0') { exclude group: 'org.jetbrains' }
    implementation('net.kyori:adventure-text-serializer-legacy:4.24.0') { exclude group: 'org.jetbrains' }
    // Adventure -> BungeeCord chat, which is what player.spigot().sendMessage
    // and Spigot's dialog API take. Both servers ship BungeeCord chat.
    implementation('net.kyori:adventure-text-serializer-bungeecord:4.4.1') {
        exclude group: 'com.google.code.gson'
        exclude group: 'net.md-5'
        exclude group: 'org.jetbrains'
    }

    // The small library every ResourcePack AI plugin shades in (the update
    // check, for one), relocated below so it never meets another plugin's copy.
    implementation 'ai.resourcepack:common:0.6.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.spigotmc:spigot-api:1.21.8-R0.1-SNAPSHOT'
}

test {
    useJUnitPlatform()
}

shadowJar {
    archiveClassifier.set('')
    relocate 'ai.resourcepack.common', 'ai.resourcepack.dialogs.libs.common'
    relocate 'net.kyori', 'ai.resourcepack.dialogs.libs.kyori'
}

// The shaded jar is the plugin; the plain one would only be a second file in
// build/libs with the same name.
jar {
    enabled = false
}

build {
    dependsOn shadowJar
}

processResources {
    inputs.property('version', project.version)
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}


// Drawn dialogs (Studio's) run on RP Engine's own dialog code, compiled in
// from a checkout of RP Engine beside this one (../rp-engine, from
// https://github.com/resourcepack-ai/rp-engine) rather than copied by hand, so
// the two plugins cannot drift: the same placeholder pass, the same list rows,
// bars, "show when" conditions and packet route. Only the package, one version
// check and the name a warning is logged under are rewritten.
def engineRoot = file('../rp-engine/src/main/java/ai/resourcepack/engine')
def engineDialogs = file("${engineRoot}/core/dialog")
def sharedDialogs = ['DialogPackets', 'DialogSnbt', 'DialogPlaceholders', 'DialogGlyphWidths', 'DialogRows', 'DialogBars', 'DialogVariables', 'DialogConditions',
                     // The player's inventory in a drawn dialog: its items drawn in the
                     // slots, their tooltips, and moving them (rp slot).
                     'DialogItems', 'DialogItemIcons', 'DialogItemModels', 'DialogSlots']
// What those need from the rest of RP Engine, copied in beside them: the
// built-in placeholders ({level}, {xp_points}, ...), the item storage a
// container is kept in, and the three API types the slots name. In this
// package they are internal; nothing here is Dialog Engine's public API.
def sharedOther = ['core/font/Placeholders', 'core/storage/ItemBytes', 'api/ContentId', 'api/DialogContainer', 'api/event/DialogSlotMoveEvent']
def generatedDialogs = layout.buildDirectory.dir('generated/rpe-dialogs')

// A Copy with nothing to copy is skipped rather than failed, which would leave
// compileJava to fail on missing classes; say what is missing instead.
tasks.register('checkEngineDialogs') {
    doLast {
        if (!engineDialogs.isDirectory()) {
            throw new GradleException('Dialog Engine compiles part of RP Engine in. Clone it beside this directory first:\n' +
                    '  git clone https://github.com/resourcepack-ai/rp-engine ../rp-engine')
        }
    }
}

tasks.register('copyEngineDialogs', Copy) {
    dependsOn 'checkEngineDialogs'
    from(engineDialogs) {
        include sharedDialogs.collect { "${it}.java" }
    }
    from(engineRoot) {
        include sharedOther.collect { "${it}.java" }
        eachFile { it.path = it.name }
    }
    includeEmptyDirs = false
    into generatedDialogs.map { it.dir('ai/resourcepack/dialogs/core/drawn') }
    filter { String line ->
        if (line.startsWith('import ai.resourcepack.engine.')) return ''
        line.replaceAll('^package ai[.]resourcepack[.]engine[a-z.]*;', 'package ai.resourcepack.dialogs.core.drawn;')
            .replace('ai.resourcepack.engine.core.version.Vanilla.maxHealth().orElse(null)', 'org.bukkit.attribute.Attribute.MAX_HEALTH')
            .replace('{@link ai.resourcepack.engine.api.DialogInfo#itemIcons()}', 'the item icons')
            .replace('McVersion.parse(Compatibility.readServerVersion()).map(Feature.TEXT_OBJECTS::on).orElse(false)', 'Heads.supported()')
            .replace('{@link Feature#TEXT_OBJECTS}', 'the 1.21.9 player text component')
            .replace('Logger.getLogger("RPEngine")', 'Logger.getLogger("DialogEngine")')
            .replace('"[RPEngine] ', '"[DialogEngine] ')
    }
    // Emptied first, so a copy left by an earlier layout (another package
    // directory) is never compiled beside this one.
    doFirst {
        delete(generatedDialogs)
    }
    doLast {
        def text = file("${generatedDialogs.get().asFile}/ai/resourcepack/dialogs/core/drawn/DialogPlaceholders.java").text
        if (text.contains('McVersion') || text.contains('Compatibility')) {
            throw new GradleException('RP Engine\'s DialogPlaceholders changed how it asks the server version; update copyEngineDialogs.')
        }
        file("${generatedDialogs.get().asFile}/ai/resourcepack/dialogs/core/drawn").listFiles().each { f ->
            if (f.text.contains('ai.resourcepack.engine.')) {
                throw new GradleException("RP Engine's ${f.name} names another part of RP Engine (ai.resourcepack.engine.*); update copyEngineDialogs.")
            }
        }
    }
}

sourceSets.main.java.srcDir(generatedDialogs)
compileJava.dependsOn('copyEngineDialogs')
sourcesJar.dependsOn('copyEngineDialogs')
