rootProject.name = 'dialog-engine'

// ai.resourcepack:common, the small library our plugins shade in, built from
// source beside this one rather than fetched from repo.resourcepack.ai.
if (file('../plugin-common').isDirectory()) {
    includeBuild('../plugin-common')
}

// ai.resourcepack:dialog-runtime, the drawn-dialog runtime both engines shade.
// From source beside this directory, else from repo.resourcepack.ai.
if (file('../dialog-runtime').isDirectory()) {
    includeBuild('../dialog-runtime')
}
