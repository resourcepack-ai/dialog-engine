# samples:social - a settings menu of six pages, drawn with a resource pack.
# /sample-social opens it, or Social menu in /dialog-samples.
#
# Every control is a setting kept on the player (set_status, set_music...),
# so it stays as it was left. Nothing reads them: a plugin of yours can,
# and any action or text can print one, e.g. {set_status}.
#
# A drawn dialog: Studio's dialog editor document, as YAML.
# Edit it with /de edit, or by hand here and run /de reload: a changed
# file is redrawn by Studio (resourcepack.ai), which needs the internet.
title: Social
command: sample-social
commandPermission: dialogengine.samples
style: dialog
document:
  row:
    - column:
        - row:
            - icon: head:{player}
              size: 24
            - column:
                - space: 2
                - text: "{player}"
                  style: heading
                  align: left
                  scale: 1
                  w: fit
                - space: 2
                - row:
                    - icon: ui:dot-green
                      size: 9
                      bind: set_status
                      states:
                        online: ui:dot-green
                        away: ui:dot-gold
                        busy: ui:dot-red
                    - column:
                        - space: 1
                        - text: "{set_status?away:Away|busy:Busy|online:Online|Online}"
                          style: muted
                          align: left
                          scale: 1
                          w: fit
                      w: fit
                      h: fit
                      gap: 0
                      pad: 0
                      align: start
                      cross: start
                  w: fit
                  h: fit
                  gap: 3
                  pad: 0
                  align: start
                  cross: start
              w: fit
              h: fit
              gap: 0
              pad: 0
              align: start
              cross: start
          w: grow
          h: fit
          gap: 4
          pad: 4
          align: start
          cross: center
          surface: well
        - space: 2
        - nav: Profile
          icon: ui:user
          w: grow
          onClick:
            action: page
            value: profile
        - nav: Chat
          icon: ui:chat
          w: grow
