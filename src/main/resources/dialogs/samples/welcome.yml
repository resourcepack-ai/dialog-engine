# samples:welcome - a notice with the player's head and one button.
# Open it with /de open samples:welcome
welcome:
  permission: dialogengine.samples
  title: "<#3670f8><bold>Welcome</bold></#3670f8>"
  body:
    - head: "{player}"
      width: 32
      height: 32
      description: "<gray>Good to see you, <white>{player}</white>."
    - text:
        - "<gray>Players online: <white>{online}"
        - ""
        - "<gray>Edit this in plugins/DialogEngine/dialogs/samples/welcome.yml"
  buttons:
    - label: "<green>Let's go"
      tooltip: "Close this and play"
      actions:
        - "[sound] entity.experience_orb.pickup 1 1.4"
        - "[close]"
